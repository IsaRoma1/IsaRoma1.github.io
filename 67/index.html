const iv=decode('5ZOUrIhbqnbIpRNz');
let database;
let enrolled;
let usePin=false;

function openDatabase() {
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open("ii41-67-local-access",1);
    req.onupgradeneeded=()=>req.result.createObjectStore("device");
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
    req.onblocked=()=>reject(new Error("Хранилище занято"));
  });
}
function readDevice() {
  return new Promise((resolve,reject)=>{
    const req=database.transaction("device").objectStore("device").get("key");
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
function writeDevice(value) {
  return new Promise((resolve,reject)=>{
    const tx=database.transaction("device","readwrite");
    tx.objectStore("device").put(value,"key");
    tx.oncomplete=()=>resolve(value);
    tx.onerror=()=>reject(tx.error);
    tx.onabort=()=>reject(tx.error);
  });
}
function deviceKey(pin,device) {
  return crypto.subtle.deriveKey(
    {name:"HKDF",hash:"SHA-256",salt:device.salt,info:encoder.encode("ii41-67:"+pin)},
    device.secret,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]
  );
}
async function rememberKey(raw,pin) {
  const secret=await crypto.subtle.importKey("raw",crypto.getRandomValues(new Uint8Array(32)),"HKDF",false,["deriveKey"]);
  const device={secret,salt:crypto.getRandomValues(new Uint8Array(16)),iv:crypto.getRandomValues(new Uint8Array(12)),failures:0};
  device.wrapped=await crypto.subtle.encrypt({name:"AES-GCM",iv:device.iv},await deviceKey(pin,device),raw);
  return writeDevice(device);
}
function setMode(pin) {
  usePin=pin;
  accessLabel.firstChild.textContent=pin?"Код быстрого входа":"Ключ доступа";
  access.value="";
  access.inputMode=pin?"numeric":"text";
  access.maxLength=pin?4:64;
  enrol.hidden=pin||!database;
  switchMode.hidden=!pin;
  problem.hidden=true;
}
function showProblem(message) { problem.textContent=message; problem.hidden=false; }
async function readKey() {
  const value=access.value.trim();
  if (!usePin) {
    if (!/^[a-f0-9]{64}$/i.test(value)) throw new Error("Введите полный ключ доступа.");
    return Uint8Array.from(value.match(/../g),part=>parseInt(part,16));
  }
  if (!/^\d{4}$/.test(value)) throw new Error("Введите четыре цифры.");
  enrolled=await readDevice();
  if (!enrolled||enrolled.failures>=5) throw new Error("Для продолжения введите полный ключ.");
  try {
    return await crypto.subtle.decrypt({name:"AES-GCM",iv:enrolled.iv},await deviceKey(value,enrolled),enrolled.wrapped);
  } catch {
    enrolled=await writeDevice({...enrolled,failures:enrolled.failures+1});
    if (enrolled.failures>=5) {
      setMode(false);
      throw new Error("Попытки исчерпаны. Введите полный ключ.");
    }
    throw new Error("Неверный код.");
  }
}
switchMode.addEventListener("click",()=>setMode(false));
form.addEventListener("submit",async event=>{
  event.preventDefault();
  submit.disabled=true;
  problem.hidden=true;
  try {
    const raw=await readKey();
    const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
    let html;
    try { html=decoder.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,encrypted)); }
    catch { throw new Error("Не удалось открыть дашборд. Проверьте полный ключ."); }
    if (!usePin && database && pinInput.value) {
      try { enrolled=await rememberKey(raw,pinInput.value); }
      catch { showProblem("Браузер не сохранил быстрый вход. Уберите код и откройте по полному ключу."); return; }
    }
    if (usePin && enrolled.failures) await writeDevice({...enrolled,failures:0});
    const app=document.createElement("iframe");
    app.title="Карта бизнес-процессов";
    app.srcdoc=html;
    document.querySelector("main").replaceWith(app);
  } catch(error) { showProblem(error.message||"Не удалось открыть дашборд."); access.focus(); access.select(); }
  finally { submit.disabled=false; }
});
(async()=>{
  try { database=await openDatabase(); enrolled=await readDevice(); setMode(Boolean(enrolled&&enrolled.failures<5)); }
  catch { setMode(false); }
})();
</script>
