<main>
<h1>Карта бизнес-процессов</h1>
<form>
<label for="key">Ключ доступа</label>
<input id="key" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required>
<button>Открыть</button>
<p role="alert" hidden></p>
</form>
</main>
