<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#f5f5f7">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-Iyps+0jGOGYXiGJjwNuQqa/iUsAha1a5vQzQ4WCLjPw='; base-uri 'none'; form-action 'none'">
    <title>Фокус — личный таск-трекер</title>
    <style>
      :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1d1d1f; background: #f5f5f7; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 440px); text-align: center; padding: 40px 24px; }
      .mark { width: 58px; height: 58px; border-radius: 18px; background: #0071e3; color: white; display: grid; place-items: center; margin: 0 auto 24px; font-size: 30px; font-weight: 500; }
      h1 { font-size: 36px; font-weight: 600; letter-spacing: -1.2px; margin: 0 0 14px; }
      p { font-size: 16px; line-height: 1.55; color: #636369; margin: 0 0 26px; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 12px 24px; color: white; background: #0071e3; border-radius: 14px; font-weight: 500; text-decoration: none; }
      a:hover { background: #0066cc; }
      a:focus-visible { outline: 3px solid #1d1d1f; outline-offset: 5px; }
      small { display: block; color: #707078; line-height: 1.5; margin-top: 24px; font-size: 13px; }
      noscript p { margin-top: 24px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✓</div>
      <h1>Фокус</h1>
      <p>Открываем твой личный таск-трекер.</p>
      <a id="open-focus" href="https://ii41-focus.r1i1.chatgpt.site/" rel="noreferrer">Открыть трекер</a>
      <small>Переход в защищённое приложение.<br>Вход через ChatGPT больше не нужен.</small>
      <noscript><p>Нажми «Открыть трекер», чтобы продолжить.</p></noscript>
    </main>
    <script>
      (() => {
        const destination = new URL("https://ii41-focus.r1i1.chatgpt.site/");
        destination.search = window.location.search;
        destination.hash = window.location.hash;
        document.getElementById("open-focus").href = destination.href;
        window.location.replace(destination.href);
      })();
    </script>
  </body>
</html>
